# Manual/Portainer ExApp deployment. Do NOT run alongside an AppAPI-managed
# instance of the same ExApp. AppAPI-managed App Store installs do not need this file.
services:
  ai-organizer:
    image: ${AI_ORGANIZER_IMAGE:-darthdragon/ai-organizer:latest}
    container_name: ai-organizer-manual
    restart: unless-stopped
    init: true
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "23000"
      APP_PERSISTENT_STORAGE: /app/data
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:?Set NEXTCLOUD_URL in .env}
      APP_SECRET: ${APP_SECRET:?Supply the existing AppAPI registration secret}
      # Optional user override for manual AppAPI testing. Normally AI Organizer
      # learns the administrator user from the authenticated AppAPI request.
      APP_USER: ${APP_USER:-}
      # Optional first-run seeds. Leave blank to configure in AI Organizer Settings.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      PAPERLESS_ENABLED: ${PAPERLESS_ENABLED:-false}
      INBOX_PATH: ${INBOX_PATH:-/inbox}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ai_organizer_data:/app/data
    # No published host ports: browser access should go through Nextcloud/AppAPI.
    expose:
      - "23000"
    networks:
      nextcloud-net:
        aliases:
          - ai_organizer
    security_opt:
      - no-new-privileges:true

volumes:
  ai_organizer_data:
    name: ai_organizer_data

networks:
  nextcloud-net:
    external: true
    name: nextcloud-net
