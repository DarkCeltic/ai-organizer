# AI Organizer
#
# Deployment-specific addresses and credentials belong in environment variables
# (.env for local/manual Docker testing). This file contains only non-secret
# application behavior defaults.

nextcloud:
  # Keep TLS verification enabled for HTTPS unless you intentionally use a
  # self-signed certificate that the container cannot validate yet.
  verify_ssl: true
  timeout: 60

  # Folder roots used when giving the LLM your existing folder structure.
  # "/" means the user's whole Files root.
  folder_tree_paths:
    - "/"

scanner:
  scan_paths:
    - "/AI Inbox"

  exclude_paths:
    - "/paperless-media"
    - "/inbox"
    - "/Photos"
    - "/AI Ignored"

  allowed_extensions:
    - pdf
    - txt
    - md
    - docx
    - odt
    - rtf
    - log
    - csv
    - json
    - xml
    - xlsx

ollama:
  # OLLAMA_URL and OLLAMA_MODEL are deployment settings and are intentionally
  # not defined here. They must be supplied for a new installation.
  timeout: 180
  temperature: 0
  # Hard ceiling for one classification response; prevents runaway generations.
  num_predict: 512

classifier:
  max_content_chars: 8000
  # Existing folder names are withheld from identity classification.
  # max_folder_entries limits the separate destination-only comparison step.
  # Existing tag names are not sent as identity evidence; exact equivalent tags
  # may be reused after classification.
  max_folder_entries: 500
  max_tag_entries: 200
  minimum_confidence: 0.70

paperless:
  # Administrator policy defaults. Settings > Paperless shows these values
  # automatically when no non-empty UI override is saved. Clearing either policy
  # list in the UI restores these config.yaml defaults instead of disabling them.
  # Categories in never_send always remain in Nextcloud.
  never_send:
    - resume
    - cv
    - curriculum vitae
    - cover letter
    - portfolio
    - source_code
    - project
    - template

  # Categories that should prefer Paperless. never_send always takes precedence.
  prefer_send:
    - receipt
    - invoice
    - statement
    - tax
    - insurance
    - contract
    - warranty

database:
  # Path is resolved relative to config.yaml. In Docker /app/config.yaml -> /app/data;
  # in PyCharm <project>/config.yaml -> <project>/data. Keep that directory persistent.
  path: "data/ai_organizer.db"
